<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<title>LoopStation Worship</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="transport">
  <div class="row">
    <button id="btnPlay" class="play" aria-label="Play / Stop">▶</button>
    <div class="bpmBox">
      <button id="bpmDown" class="round" aria-label="BPM -">−</button>
      <div class="bpmVal"><input id="bpmNum" type="number" inputmode="numeric" min="40" max="240" value="100"><small>BPM</small></div>
      <button id="bpmUp" class="round" aria-label="BPM +">+</button>
    </div>
    <button id="btnTap" class="chip" data-i18n="tap">Tap</button>
    <button id="btnMetro" class="chip on" aria-label="Metronome">♩</button>
    <button id="btnLang" class="chip">FR</button>
  </div>
  <input id="bpmRange" type="range" min="40" max="240" value="100" aria-label="BPM">
</header>

<nav id="tabs">
  <button data-tab="loop" class="active" data-i18n="tab_loop">Loop</button>
  <button data-tab="rec" data-i18n="tab_rec">Record</button>
  <button data-tab="sep" data-i18n="tab_sep">Separate</button>
  <button data-tab="lib" data-i18n="tab_lib">Library</button>
</nav>

<main>
  <!-- LOOP -->
  <section id="tab-loop" class="tab active">
    <div class="panel grid2">
      <label><span data-i18n="steps">Steps / bar</span>
        <select id="selSteps"><option>8</option><option>12</option><option selected>16</option><option>24</option><option>32</option></select></label>
      <label><span data-i18n="preset">Preset</span>
        <select id="selPreset"><option value="0">Groove 16</option><option value="1">12 steps</option><option value="2">Minimal</option></select></label>
      <label class="span2"><span data-i18n="master">Master</span>
        <input id="master" type="range" min="0" max="1" step="0.01" value="0.9"></label>
    </div>

    <div id="tracks"></div>

    <div class="panel addRow">
      <select id="selAdd"></select>
      <button id="btnAdd" class="btn" data-i18n="add">Add</button>
    </div>

    <h3 data-i18n="pads">Live pads</h3>
    <div id="pads" class="pads"></div>

    <h3 data-i18n="clips">Recorded loops</h3>
    <div id="clips"></div>

    <div class="panel">
      <input id="projName" type="text" data-i18n-ph="proj_name" placeholder="Project name" value="Sunday">
      <div class="btnRow">
        <button id="btnSave" class="btn" data-i18n="save">Save project</button>
        <button id="btnExport" class="btn" data-i18n="export">Export loop (WAV)</button>
        <button id="btnClear" class="btn ghost" data-i18n="clear">Clear pattern</button>
        <label class="btn ghost fileBtn"><span data-i18n="import_sample">Import audio sample</span>
          <input id="fileSample" type="file" accept="audio/*" multiple hidden></label>
      </div>
    </div>
  </section>

  <!-- RECORD -->
  <section id="tab-rec" class="tab">
    <h3 data-i18n="rec_title">Record your own beats</h3>
    <div class="panel grid2">
      <label><span data-i18n="rec_bars">Length (bars)</span>
        <select id="recBars"><option>1</option><option selected>2</option><option>4</option><option>8</option></select></label>
      <label><span data-i18n="rec_count">Count-in</span>
        <select id="recCount"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select></label>
      <label class="span2"><span data-i18n="rec_lat">Latency offset (ms)</span> <b id="latVal">0</b>
        <input id="recLat" type="range" min="-100" max="300" step="5" value="0"></label>
    </div>
    <div class="meter"><div id="meterBar"></div></div>
    <div class="btnRow">
      <button id="btnMic" class="btn" data-i18n="rec_mic">Enable microphone</button>
      <button id="btnRecLoop" class="btn rec" data-i18n="rec_go">Record synced loop</button>
    </div>
    <p id="recStatus" class="status"></p>
    <p class="hint" data-i18n="rec_tip"></p>

    <h3 data-i18n="rec_one">Record a one-shot sample</h3>
    <div class="panel">
      <input id="oneName" type="text" data-i18n-ph="rec_name" placeholder="Sample name">
      <div class="btnRow">
        <button id="btnOneStart" class="btn" data-i18n="rec_start">Start</button>
        <button id="btnOneStop" class="btn rec" data-i18n="rec_end">Stop &amp; save</button>
      </div>
    </div>
  </section>

  <!-- SEPARATE -->
  <section id="tab-sep" class="tab">
    <h3 data-i18n="sep_title">Separate a song into tracks</h3>
    <p class="hint" data-i18n="sep_help"></p>
    <div class="panel">
      <label><span data-i18n="sep_server">Server address</span>
        <input id="sepUrl" type="url" placeholder="http://192.168.1.20:8000"></label>
      <label><span data-i18n="sep_token">Token (optional)</span>
        <input id="sepToken" type="password" autocomplete="off"></label>
      <button id="btnTest" class="btn ghost" data-i18n="sep_test">Test connection</button>
    </div>
    <div class="panel grid2">
      <label class="span2"><span data-i18n="sep_file">Choose a song</span>
        <input id="sepFile" type="file" accept="audio/*"></label>
      <label><span data-i18n="sep_model">Model</span>
        <select id="sepModel">
          <option value="htdemucs_6s">6 stems: vocals · drums · bass · guitar · piano · other</option>
          <option value="htdemucs">4 stems: vocals · drums · bass · other</option>
        </select></label>
      <label><span data-i18n="sep_fmt">Output format</span>
        <select id="sepFmt"><option value="wav">WAV</option><option value="mp3">MP3</option></select></label>
    </div>
    <button id="btnSep" class="btn big" data-i18n="sep_go">Separate</button>
    <p id="sepStatus" class="status"></p>

    <h3 data-i18n="sep_player">Stem player</h3>
    <div id="stemPlayer"></div>
  </section>

  <!-- LIBRARY -->
  <section id="tab-lib" class="tab">
    <button id="btnRefresh" class="btn ghost" data-i18n="lib_refresh">Refresh</button>
    <h3 data-i18n="lib_projects">Projects</h3><div id="libProjects"></div>
    <h3 data-i18n="lib_exports">Exported loops</h3><div id="libLoops"></div>
    <h3 data-i18n="lib_samples">Samples</h3><div id="libSamples"></div>
    <h3 data-i18n="lib_recs">Recordings</h3><div id="libRecs"></div>
    <h3 data-i18n="lib_stems">Separated songs</h3><div id="libStems"></div>
  </section>
</main>

<div id="toast" role="status"></div>

<div id="permModal" class="modal" hidden>
  <div class="card">
    <h3 data-i18n="perm_title">Permissions</h3>
    <p data-i18n="perm_body"></p>
    <div class="btnRow">
      <button id="permOk" class="btn" data-i18n="ok">Allow</button>
      <button id="permLater" class="btn ghost" data-i18n="later">Later</button>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
